# cargo-deny configuration (ARCHITECTURE §11, ADR-0001).
[graph]
all-features = true
# Only the platforms Reclaim builds for; platform-specific deps of other targets are not linked.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
]

# Slint is only used by the M0 UI spike so far. If it is chosen (ADR-0001), Reclaim uses it under
# the Slint Royalty-free Desktop License 2.0, which requires attribution in the About screen.
exceptions = [
    { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies between unpublished workspace crates are fine.
allow-wildcard-paths = true
# Reclaim has no network code (ARCHITECTURE §9). Async runtimes are excluded too (ADR-0001).
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "tokio" },
    { name = "async-std" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
