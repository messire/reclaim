# cargo-deny configuration (ARCHITECTURE §11, ADR-0001).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Reclaim has no network code (ARCHITECTURE §9). Async runtimes are excluded too (ADR-0001).
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "tokio" },
    { name = "async-std" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
