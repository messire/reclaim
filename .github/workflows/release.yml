name: Release

# Tagged build (PLAN M6.3): push a tag `vX.Y.Z` to produce a draft GitHub release with the
# installer, zip, SHA256SUMS and third-party notices. The draft is published by the owner by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Reproducibility: no absolute build paths in the binaries.
  RUSTFLAGS: "-C target-feature=+crt-static --remap-path-prefix=D:\\a\\reclaim\\reclaim=. --remap-path-prefix=C:\\Users\\runneradmin\\.cargo=~/.cargo"

jobs:
  release:
    name: Build release (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p reclaim-app -p reclaim-cli
      - name: Reproducibility check (second build in a clean target dir)
        shell: pwsh
        run: |
          cargo build --release --locked -p reclaim-app -p reclaim-cli --target-dir target-repro
          $lines = @("## Reproducibility", "", "| Binary | Build 1 | Build 2 | Identical |", "|---|---|---|---|")
          foreach ($f in "reclaim.exe", "reclaim-cli.exe") {
            $a = (Get-FileHash "target/release/$f" -Algorithm SHA256).Hash
            $b = (Get-FileHash "target-repro/release/$f" -Algorithm SHA256).Hash
            $lines += "| $f | $a | $b | $($a -eq $b) |"
          }
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Installer and portable zip (scripts/build-installer.ps1)
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -SkipBuild -NoInstallTools
          $setup = (Get-Item dist/*-setup.exe).Name
          $zip = (Get-Item dist/*.zip).Name
          $stage = (Get-ChildItem target/installer -Directory | Select-Object -First 1).FullName
          $sums = foreach ($f in "dist/$setup", "dist/$zip", "$stage/reclaim.exe", "$stage/reclaim-cli.exe") {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $sums | Out-File -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          "ZIP=dist/$zip" | Out-File -Append $env:GITHUB_ENV
          "SETUP=dist/$setup" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
            SHA256SUMS
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
            SHA256SUMS
