[package]
name = "reclaim-bench"
description = "Benchmark harness, probes and research spikes for Reclaim (never shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `unsafe` is allowed here (FFI), but every block needs a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "api-spike"
path = "src/bin/api_spike/main.rs"

[[bin]]
name = "ui-bench"
path = "src/bin/ui_bench/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
