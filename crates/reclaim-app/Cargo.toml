[package]
name = "reclaim-app"
description = "Reclaim desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `unsafe` is allowed here (FFI), but every block needs a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "reclaim"
path = "src/main.rs"

[dependencies]
reclaim-core.workspace = true
reclaim-engine.workspace = true
reclaim-storage-core.workspace = true
reclaim-storage-engine.workspace = true

[dev-dependencies]
serde_json.workspace = true
reclaim-platform-fake.workspace = true

[target.'cfg(windows)'.dependencies]
reclaim-platform-windows.workspace = true
reclaim-storage-windows.workspace = true
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "system-tray",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
png = "0.18"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
