[package]
name = "reclaim-platform-windows"
description = "Windows implementation of Reclaim's platform ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `unsafe` is allowed here (FFI), but every block needs a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dependencies]
reclaim-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Probe workload for the integration tests: allocates and touches memory on request.
[[bin]]
name = "reclaim-test-probe"
path = "src/bin/probe.rs"
test = false
